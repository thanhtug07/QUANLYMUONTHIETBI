# Giao diện cố định SÁNG: nền trắng, xanh dương chủ đạo (khớp
# styles/tokens.COLORS). Bảng màu tối vẫn có trong tokens.py nhưng không bật.
[theme]
base = "light"
primaryColor = "#0054A3"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F8FD"
textColor = "#1B2A41"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Ẩn nút Deploy / menu dev của Streamlit (từng chồng lên topbar trên điện thoại).
toolbarMode = "minimal"
# Navigation tự vẽ bằng component riêng (ui/sidebar.py)
showSidebarNavigation = false
