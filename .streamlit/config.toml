# Hai chế độ sáng / tối: mặc định theo hệ điều hành, người dùng đổi trong
# menu ⋮ -> Settings -> Theme. Giá trị khớp styles/tokens.py (COLORS và
# DARK_COLORS); CSS tự đổi theo qua ui/theme.is_dark().
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#0054A3"
backgroundColor = "#F0F2F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#31333F"

[theme.dark]
primaryColor = "#5AA9F5"
backgroundColor = "#0F1720"
secondaryBackgroundColor = "#17212C"
textColor = "#E6EAF0"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Navigation tự vẽ bằng component riêng (ui/sidebar.py)
showSidebarNavigation = false
